name: ChainzNewz daily refresh

on:
  schedule:
    - cron: "17 9 * * 1-5"    # about 5:17am Eastern
    - cron: "43 10 * * 1-5"   # backup, about 6:43am Eastern
    - cron: "23 12 * * 1-5"   # backup, about 8:23am Eastern
  workflow_dispatch:           # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: chainznewz-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull today's news into feed.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_feed.py

      - name: Save feed.json (Netlify redeploys automatically)
        run: |
          git config user.name "ChainzNewz Bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Daily news refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
