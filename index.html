<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1692E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<title>ChainzNewz</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="ChainzNewz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800;1,900&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --surface-2:#F5F6F7; --ink:#1E1F21; --ink-2:#4B4F55; --ink-3:#7A7F86;
  --line:#DDE0E4; --head-bg:rgba(255,255,255,.5); --tab-bg:rgba(255,255,255,.9); --orange:#D8621A; --orange-ink:#FFFFFF; --amber:#E0901F; --gold:#D9AE1C; --char:#262626; --steel:#8A8F96;
  --hot:#C8341E; --hot-bg:#FBE6E1; --warm:#A35F00; --warm-bg:#FCEFD9; --watch:#5B636C; --watch-bg:#E8EBEE;
  --logo-bg:transparent; --shadow:0 1px 2px rgba(30,31,33,.06),0 4px 16px rgba(30,31,33,.05);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark; --bg:#131416; --surface:#1D1F22; --surface-2:#25282C; --ink:#EDEEF0; --ink-2:#B9BDC3; --ink-3:#8C9198;
    --line:#2F3338; --head-bg:rgba(29,31,34,.5); --tab-bg:rgba(29,31,34,.9); --hot:#FF7A61; --hot-bg:#3A1F1A; --warm:#F2B04E; --warm-bg:#352813; --watch:#AAB2BB; --watch-bg:#2A2E33;
    --logo-bg:#FFFFFF; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#131416; --surface:#1D1F22; --surface-2:#25282C; --ink:#EDEEF0; --ink-2:#B9BDC3; --ink-3:#8C9198;
  --line:#2F3338; --head-bg:rgba(29,31,34,.5); --tab-bg:rgba(29,31,34,.9); --hot:#FF7A61; --hot-bg:#3A1F1A; --warm:#F2B04E; --warm-bg:#352813; --watch:#AAB2BB; --watch-bg:#2A2E33;
  --logo-bg:#FFFFFF; --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* Header */
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);border-bottom:1px solid var(--line);transition:transform .25s ease;will-change:transform}
.top.hide{transform:translateY(calc(-100% - 2px))}
.top-inner{max-width:640px;margin:0 auto;padding:5px 16px 6px;display:flex;align-items:center;justify-content:center}
.logo{display:block;flex:0 0 auto;background:var(--logo-bg);border-radius:8px;padding:2px 4px;line-height:0}
.logo img{height:48px;width:auto}
.brand{margin:0 auto;text-align:center;font-family:"Exo 2","Arial Black",Arial,sans-serif;font-style:italic;font-weight:900;font-size:29px;line-height:1.1;letter-spacing:-.01em;padding:0 6px;
  background:linear-gradient(100deg,#7FDCFF 0%,#35B8F5 35%,#1692E6 70%,#0B6FC2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(14,127,214,.35)) drop-shadow(0 3px 8px rgba(34,168,240,.28));white-space:nowrap}
.brand span{font-weight:800}
@media (max-width:380px){.brand{font-size:26px}}

/* Feed */
main{max-width:640px;margin:0 auto;padding:8px 16px 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:10px 2px 12px}
.section-head h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.section-head .count{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.feed{display:flex;flex-direction:column;gap:16px}
.day-label{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:6px 2px -4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;color:#fff;flex:0 0 auto}
.who{min-width:0;flex:1}
.who b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12.5px;color:var(--ink-3)}
.heat{flex:0 0 auto;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;font-weight:500}
.heat.Hot{background:var(--hot-bg);color:var(--hot)}
.heat.Warm{background:var(--warm-bg);color:var(--warm)}
.heat.Watch{background:var(--watch-bg);color:var(--watch)}
.cover{display:block;width:100%;aspect-ratio:40/21;max-width:100%;background:var(--surface-2)}
.cover svg{display:block;width:100%;height:100%}
.card-body{padding:14px 14px 4px;display:flex;flex-direction:column;gap:10px}
.card-body h2{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.1;margin:0;text-wrap:balance}
.card-body h2 a{text-decoration:none}
.card-body h2 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.summary{margin:0;color:var(--ink-2)}
.why{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.why-label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);margin-bottom:3px}
.why p{margin:0}
.meta-row{display:flex;flex-wrap:wrap;gap:6px}
.pchip{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:6px;border:1px solid var(--line);color:var(--ink-2)}
.lane{font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:6px;background:var(--char);color:#fff}
.next{font-size:14px;color:var(--ink-2);margin:0}
.next b{color:var(--ink)}
.date-note{font-size:12.5px;color:var(--ink-3);margin:0}

.opener{display:none;margin:0 14px 10px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.opener.open{display:block}
.opener pre{margin:0 0 8px;white-space:pre-wrap;font-family:var(--body);font-size:14.5px}
.btn-copy{border:1px solid var(--orange);background:transparent;color:var(--orange);border-radius:8px;padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer}

.actions{display:flex;border-top:1px solid var(--line);margin-top:8px}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:0;padding:11px 4px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;text-decoration:none;min-width:0}
.act:hover{background:var(--surface-2)}
.act svg{width:18px;height:18px;flex:0 0 auto}
.act[aria-pressed="true"].star{color:var(--gold)}
.act[aria-pressed="true"].done{color:#2E8B57}
.act .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.act .lbl.opt{display:none}}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--display);font-size:20px;text-transform:uppercase;color:var(--ink);margin-bottom:4px}
.hidden-note{text-align:center;font-size:13px;color:var(--ink-3);margin:14px 0 0}
.hidden-note button{background:none;border:0;color:var(--orange);font-weight:600;cursor:pointer;padding:0 4px}
.src-note{font-size:13px;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:16px}

/* Footer */
.foot{max-width:640px;margin:0 auto;padding:28px 16px 84px;display:flex;flex-direction:column;align-items:center;gap:14px}
.share{background:var(--orange);color:var(--orange-ink);border:0;border-radius:999px;padding:13px 40px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.12em;cursor:pointer;box-shadow:0 4px 14px rgba(216,98,26,.3)}
.share:hover{filter:brightness(1.06)}
.share-link{display:none;width:100%;max-width:420px;gap:8px}
.share-link.show{display:flex}
.share-link input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:12px}
.powered{font-size:13px;color:var(--ink-3)}
.powered a{color:var(--orange);font-weight:600;text-decoration:none}
.powered a:hover{text-decoration:underline}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tab-bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);transition:transform .25s ease;will-change:transform}
.tabs.hide{transform:translateY(100%)}
.tabs-inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px 5px;font-size:10.5px;font-weight:600;color:var(--ink-3);cursor:pointer;position:relative}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{color:var(--orange)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--orange)}
.badge{position:absolute;top:1px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:700;line-height:17px;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--char);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast,.top,.tabs{transition:none}}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:50;display:flex;align-items:center;gap:8px;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;
  box-shadow:0 4px 14px rgba(0,0,0,.12);transform:translate(-50%,-80px);opacity:0;pointer-events:none}
.ptr svg{width:16px;height:16px;transition:transform .15s}
.ptr.ready svg{transform:rotate(180deg)}
.ptr.spin svg{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
.ptr.back{transition:transform .25s ease,opacity .25s ease}
@media (prefers-reduced-motion:reduce){.ptr.spin svg{animation:none}}
</style>

</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand" role="heading" aria-level="1" aria-label="ChainzNewz">Chainz<span>Newz</span></div>
  </div>
</header>


<main>
  <div class="section-head"><h1 id="view-title">Today</h1><span class="count" id="view-count"></span></div>
  <div class="feed" id="feed"></div>
  <p class="hidden-note" id="hidden-note" hidden></p>
</main>

<footer class="foot">
  <button class="share" id="share" type="button">SHARE</button>
  <div class="share-link" id="share-link">
    <input id="share-url" readonly aria-label="Link to this app">
    <button class="btn-copy" id="share-copy" type="button">Copy</button>
  </div>
  <div class="powered">Powered By: <a href="https://www.supplychainz.com" target="_blank" rel="noopener">www.supplychainz.com</a></div>
</footer>

<nav class="tabs" aria-label="Views">
  <div class="tabs-inner" role="tablist" id="tabs"></div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span id="ptr-text">Pull to refresh</span></div>

<script>
const SHARE_URL = "https://claude.ai/artifact/RX61NgzGn5qjsUkfyuA59C";
const ICONS = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>',
  week:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>',
  starFill:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>',
  done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14l-3-3"/></svg>',
  hide:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.6 6.6C3.9 8.4 2 12 2 12s4 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/></svg>',
  msg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/></svg>',
  read:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'
};
const TABS = [
  {id:'today', label:'Today', icon:ICONS.today},
  {id:'week', label:'This Week', icon:ICONS.week},
  {id:'history', label:'History', icon:ICONS.history},
  {id:'starred', label:'Starred', icon:ICONS.star},
  {id:'contacted', label:'Contacted', icon:ICONS.done}
];
const FILTERS = [
  {id:'all', label:'All'}, {id:'Hot', label:'Hot'}, {id:'Warm', label:'Warm'}, {id:'Watch', label:'Watch'},
  {id:'laneA', label:'Lane A · Foodservice'}, {id:'laneB', label:'Lane B · Cold chain'}
];
const HEAT_ORDER = {Hot:0, Warm:1, Watch:2};

/* per-viewer state (browser only) */
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const state = {
  tab: load('lf.tab','today'), filter:'all',
  starred: new Set(load('lf.starred',[])), contacted: new Set(load('lf.contacted',[])), hidden: new Set(load('lf.hidden',[])),
  showHidden:false, openers:new Set(), feed:null
};
if (/^[a-z]+$/.test(location.hash.slice(1)) && TABS.some(t=>t.id===location.hash.slice(1))) state.tab = location.hash.slice(1);

/* helpers */
const $ = s => document.querySelector(s);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function parseDay(d){ const [y,m,dd] = d.split('-').map(Number); return new Date(y, m-1, dd); }
function fmtDay(d){ return parseDay(d).toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'}); }
function shortDay(d){ return parseDay(d).toLocaleDateString('en-US',{month:'short', day:'numeric'}); }
function ago(pub, ref){
  if(!pub) return 'Date unconfirmed';
  const days = Math.round((parseDay(ref) - parseDay(pub)) / 864e5);
  if (days <= 0) return 'Today'; if (days === 1) return '1d ago'; if (days < 7) return days + 'd ago';
  return shortDay(pub);
}
function initials(name){ return name.replace(/[^A-Za-z ]/g,'').split(/\s+/).filter(w=>!/^(the|of|and)$/i.test(w)).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
const AV_COLORS = ['#D8621A','#B8860B','#3C6E8F','#6B4C9A','#2E7D5B','#8A3B2E','#4B5563'];
function avColor(name){ let h=0; for (const c of name) h = (h*31 + c.charCodeAt(0)) >>> 0; return AV_COLORS[h % AV_COLORS.length]; }

/* cover art: one motif per signal type */
function cover(item){
  const t = item.type, c = item.cover || {};
  const P = {
    growth:['#D9AE1C','#D8621A'], pricing:['#E0901F','#B8460F'], mna:['#2B2B2B','#4A4A4A'],
    chain:['#5B636C','#2F343A'], buyer:['#D8621A','#8A3B12'], coldchain:['#3C6E8F','#1F3F55'], regulation:['#6B7280','#374151']
  }[t] || ['#5B636C','#2F343A'];
  const gid = 'g' + item.id.replace(/[^a-z0-9]/gi,'');
  let motif = '';
  if (t === 'growth'){
    const hs = [60,95,85,130,165,210];
    motif = hs.map((h,i)=>`<rect x="${380+i*38}" y="${310-h}" width="26" height="${h}" rx="3" fill="#fff" opacity="${.12+i*.03}"/>`).join('')
      + `<path d="M370 250 L600 90" stroke="#fff" stroke-width="5" opacity=".35" stroke-linecap="round"/><path d="M572 88 L602 88 L602 118" fill="none" stroke="#fff" stroke-width="5" opacity=".35" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else if (t === 'pricing'){
    let w=''; for(let r=0;r<9;r++){ let d=`M300 ${40+r*34}`; for(let x=300;x<=660;x+=24){ d+=` Q ${x+12} ${40+r*34-(r%2?14:-14)} ${x+24} ${40+r*34}`; } w+=`<path d="${d}" fill="none" stroke="#fff" stroke-width="3" opacity=".16"/>`; }
    motif = w;
  } else if (t === 'mna'){
    motif = `<circle cx="490" cy="168" r="105" fill="#D8621A" opacity=".85"/><circle cx="580" cy="168" r="105" fill="#D9AE1C" opacity=".75" style="mix-blend-mode:screen"/>`;
  } else if (t === 'chain'){
    let g=''; for(let r=0;r<4;r++) for(let k=0;k<6;k++){ g+=`<rect x="${370+k*44}" y="${56+r*60}" width="32" height="40" rx="4" fill="#fff" opacity="${(r+k)%3===0?.34:.12}"/>`; }
    motif = g;
  } else if (t === 'coldchain'){
    motif = [0,30,60,90,120,150].map(a=>`<line x1="${510-Math.cos(a*Math.PI/180)*110}" y1="${168-Math.sin(a*Math.PI/180)*110}" x2="${510+Math.cos(a*Math.PI/180)*110}" y2="${168+Math.sin(a*Math.PI/180)*110}" stroke="#fff" stroke-width="6" opacity=".2" stroke-linecap="round"/>`).join('');
  } else {
    motif = `<path d="M390 70 h220 a16 16 0 0 1 16 16 v120 a16 16 0 0 1 -16 16 h-150 l-44 36 v-36 h-26 a16 16 0 0 1 -16 -16 v-120 a16 16 0 0 1 16 -16z" fill="#fff" opacity=".18"/>`;
  }
  const stat = esc(c.stat || ''), size = stat.length > 9 ? 56 : stat.length > 6 ? 68 : 88;
  return `<svg viewBox="0 0 640 336" role="img" aria-label="${esc(c.kicker||'')}: ${stat}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${P[0]}"/><stop offset="1" stop-color="${P[1]}"/></linearGradient></defs>
    <rect width="640" height="336" fill="url(#${gid})"/>${motif}
    <text x="34" y="62" fill="#fff" opacity=".9" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="2">${esc((c.kicker||'').toUpperCase())}</text>
    <text x="30" y="${150+size*.35}" fill="#fff" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="800" font-size="${size}">${stat}</text>
    <text x="34" y="${190+size*.35}" fill="#fff" opacity=".92" font-family="Barlow, sans-serif" font-weight="600" font-size="22">${esc(c.sub||'')}</text>
    <text x="34" y="306" fill="#fff" opacity=".7" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="1">${esc(item.source.toUpperCase())}</text>
  </svg>`;
}

function card(item, ref){
  const starred = state.starred.has(item.id), done = state.contacted.has(item.id), hidden = state.hidden.has(item.id), opOpen = state.openers.has(item.id);
  const hasOpener = !!(item.opener && item.opener.trim());
  return `<article class="card" data-id="${esc(item.id)}">
    <div class="card-head">
      <div class="avatar" style="background:${avColor(item.source)}" aria-hidden="true">${esc(initials(item.source))}</div>
      <div class="who"><b>${esc(item.source)}</b><span>${esc(ago(item.published, ref))} · ${esc(item.company||'')}</span></div>
      <span class="heat ${esc(item.heat)}">${esc(item.heat)}</span>
    </div>
    <a class="cover" href="${esc(item.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">${cover(item)}</a>
    <div class="card-body">
      <h2><a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.headline)}</a></h2>
      <p class="summary">${esc(item.summary)}</p>
      ${item.dateNote ? `<p class="date-note">${esc(item.dateNote)}</p>` : ''}
      <div class="why"><div class="why-label">Why it matters</div><p>${esc(item.signal)}</p></div>
      <div class="meta-row"><span class="lane">Lane ${esc(item.lane)}</span>${(item.products||[]).map(p=>`<span class="pchip">${esc(p)}</span>`).join('')}</div>
      <p class="next"><b>Next step:</b> ${esc(item.nextStep)}</p>
    </div>
    ${hasOpener ? `<div class="opener ${opOpen?'open':''}"><pre>${esc(item.opener)}</pre><button class="btn-copy" type="button" data-act="copy-opener">Copy message</button></div>` : ''}
    <div class="actions">
      <button class="act star" type="button" data-act="star" aria-pressed="${starred}">${starred?ICONS.starFill:ICONS.star}<span class="lbl">${starred?'Starred':'Star'}</span></button>
      <button class="act done" type="button" data-act="contacted" aria-pressed="${done}">${ICONS.done}<span class="lbl">${done?'Contacted':'Contact'}</span></button>
      ${hasOpener ? `<button class="act" type="button" data-act="opener" aria-expanded="${opOpen}">${ICONS.msg}<span class="lbl opt">Message</span></button>` : ''}
      <button class="act" type="button" data-act="hide">${ICONS.hide}<span class="lbl opt">${hidden?'Unhide':'Not relevant'}</span></button>
      <a class="act" href="${esc(item.url)}" target="_blank" rel="noopener">${ICONS.read}<span class="lbl opt">Read</span></a>
    </div>
  </article>`;
}

function renderTabs(){
  $('#tabs').innerHTML = TABS.map(t=>{
    let n = 0;
    if (t.id==='starred') n = state.starred.size;
    if (t.id==='contacted') n = state.contacted.size;
    if (t.id==='today' && state.feed){ const last = latestRun(); n = state.feed.items.filter(i=>i.found===last && !state.hidden.has(i.id)).length; }
    return `<button class="tab" role="tab" type="button" data-tab="${t.id}" aria-selected="${state.tab===t.id}">${t.icon}<span>${t.label}</span>${n?`<span class="badge">${n}</span>`:''}</button>`;
  }).join('');
}
function renderFilters(){
  const fe=$('#filters'); if(!fe) return;
  fe.innerHTML = FILTERS.map(f=>`<button class="chip-f" type="button" data-filter="${f.id}" aria-pressed="${state.filter===f.id}">${f.label}</button>`).join('');
}
function latestRun(){ return state.feed.items.reduce((m,i)=> i.found > m ? i.found : m, ''); }
function passesFilter(i){
  const f = state.filter;
  if (f==='all') return true;
  if (f==='laneA') return i.lane.includes('A');
  if (f==='laneB') return i.lane.includes('B');
  return i.heat === f;
}
function sortItems(a,b){ return (b.found||'').localeCompare(a.found||'') || HEAT_ORDER[a.heat]-HEAT_ORDER[b.heat] || (b.published||'').localeCompare(a.published||''); }

function render(){
  renderTabs(); renderFilters();
  const feed = state.feed; if (!feed) return;
  const ref = feed.updated.slice(0,10);
  const last = latestRun();
  let items = feed.items.slice();
  let title = 'Today', emptyMsg = ['Nothing new this morning','The 5am scan found no new signals today. Check This Week for the rest.'];
  if (state.tab==='today'){ items = items.filter(i=>i.found===last); title = 'Today · ' + shortDay(last); }
  if (state.tab==='week'){ const cut = new Date(parseDay(ref).getTime() - 6*864e5); items = items.filter(i=>parseDay(i.found) >= cut); title = 'This Week'; emptyMsg = ['Quiet week so far','New items show up here after each weekday scan.']; }
  if (state.tab==='history'){ title = 'Last 30 Days'; emptyMsg = ['No history yet','Past days build up here, up to 30 days back.']; }
  if (state.tab==='starred'){ items = items.filter(i=>state.starred.has(i.id)); title = 'Starred'; emptyMsg = ['No starred leads','Tap Star on any post to save it here.']; }
  if (state.tab==='contacted'){ items = items.filter(i=>state.contacted.has(i.id)); title = 'Contacted'; emptyMsg = ['No one contacted yet','Tap Contact after you reach out, and it lands here.']; }
  const hiddenInView = items.filter(i=>state.hidden.has(i.id)).length;
  if (!state.showHidden && state.tab!=='starred' && state.tab!=='contacted') items = items.filter(i=>!state.hidden.has(i.id));
  const filtered = items.filter(passesFilter);
  if (state.filter==='laneB' && !filtered.length) emptyMsg = ['No cold chain signals','Nothing for Lane B in this view. The scan checks every weekday.'];
  else if (state.filter!=='all' && !filtered.length) emptyMsg = ['Nothing matches','Try another filter or switch to All.'];
  filtered.sort(sortItems);

  $('#view-title').textContent = title;
  $('#view-count').textContent = filtered.length + (filtered.length===1?' post':' posts');
  let html = '';
  if (!filtered.length){ html = `<div class="empty"><b>${emptyMsg[0]}</b>${emptyMsg[1]}</div>`; }
  else if (state.tab==='week' || state.tab==='history'){
    let cur = '';
    for (const i of filtered){ if (i.found !== cur){ cur = i.found; html += `<div class="day-label">Found ${esc(fmtDay(cur))}</div>`; } html += card(i, ref); }
  } else html = filtered.map(i=>card(i, ref)).join('');
  $('#feed').innerHTML = html;

  const hn = $('#hidden-note');
  if (hiddenInView && state.tab!=='starred' && state.tab!=='contacted'){
    hn.hidden = false;
    hn.innerHTML = state.showHidden ? `Showing ${hiddenInView} hidden <button type="button" data-act="toggle-hidden">Hide them</button>` : `${hiddenInView} marked not relevant <button type="button" data-act="toggle-hidden">Show</button>`;
  } else hn.hidden = true;
}

let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }
async function copyText(text, input){
  try{ await navigator.clipboard.writeText(text); toast('Copied'); return true; }
  catch(e){ if (input){ input.focus(); input.select(); toast('Press Ctrl+C / ⌘C to copy'); } return false; }
}
function toggleSet(set, key, id){ set.has(id) ? set.delete(id) : set.add(id); save(key, [...set]); }

document.addEventListener('click', async e=>{
  const tab = e.target.closest('[data-tab]');
  if (tab){ state.tab = tab.dataset.tab; save('lf.tab', state.tab); state.showHidden=false; render(); window.scrollTo({top:0}); window.__showBars && window.__showBars(); return; }
  const f = e.target.closest('[data-filter]');
  if (f){ state.filter = f.dataset.filter; render(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act==='toggle-hidden'){ state.showHidden = !state.showHidden; render(); return; }
  const cardEl = a.closest('.card'); const id = cardEl && cardEl.dataset.id; if (!id) return;
  const item = state.feed.items.find(i=>i.id===id);
  if (act==='star'){ toggleSet(state.starred,'lf.starred',id); toast(state.starred.has(id)?'Starred':'Removed from Starred'); }
  if (act==='contacted'){ toggleSet(state.contacted,'lf.contacted',id); toast(state.contacted.has(id)?'Marked contacted':'Unmarked'); }
  if (act==='hide'){ toggleSet(state.hidden,'lf.hidden',id); toast(state.hidden.has(id)?'Marked not relevant':'Restored'); }
  if (act==='opener'){ state.openers.has(id) ? state.openers.delete(id) : state.openers.add(id); }
  if (act==='copy-opener'){ await copyText(item.opener); return; }
  render();
});

$('#share').addEventListener('click', async ()=>{
  const box = $('#share-link'), input = $('#share-url');
  const inArtifact = /claude\.ai|claudeusercontent/.test(location.hostname) || location.protocol === 'blob:' || location.protocol === 'about:';
  const url = inArtifact ? SHARE_URL : location.origin + location.pathname;
  if (!inArtifact && navigator.share){ try{ await navigator.share({title:'ChainzNewz', text:'Packaging and cold chain news from SupplyChainz', url}); return; }catch(e){ if (e && e.name === 'AbortError') return; } }
  input.value = url; box.classList.add('show');
  await copyText(url, input);
});
$('#share-copy').addEventListener('click', ()=> copyText($('#share-url').value, $('#share-url')));

async function loadFeed(force){
  try{
    const r = await fetch('/api/news' + (force ? '?force=1&' : '?') + 't=' + Date.now(), {cache:'no-store'});
    if (r.ok){ const f = await r.json(); if (f && Array.isArray(f.items) && f.items.length) return f; }
  }catch(e){}
  const r = await fetch('feed.json?t=' + Date.now(), {cache:'no-store'});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
let lastCheck = 0, loading = false;
async function refreshFeed(show){
  if (loading) return; loading = true;
  try{
    const f = await loadFeed(show);
    const changed = !state.feed || f.updated !== state.feed.updated || f.items.length !== state.feed.items.length;
    state.feed = f; lastCheck = Date.now();
    if (changed) render();
    if (show) toast(changed ? 'New posts loaded' : 'Up to date');
  }catch(err){
    if (!state.feed) $('#feed').innerHTML = `<div class="empty"><b>Feed didn't load</b>Pull down to try again.</div>`;
    else if (show) toast("Couldn't refresh. Try again.");
  }finally{ loading = false; }
}
async function boot(){
  renderTabs(); renderFilters();
  await refreshFeed(false);
}
/* check for new posts whenever the app comes back to the screen */
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState === 'visible' && Date.now() - lastCheck > 60000) refreshFeed(false); });
window.addEventListener('pageshow', e=>{ if (e.persisted) refreshFeed(false); });
window.addEventListener('focus', ()=>{ if (Date.now() - lastCheck > 60000) refreshFeed(false); });
/* pull down at the top of the feed to refresh */
(function(){
  const el = document.getElementById('ptr'), txt = document.getElementById('ptr-text');
  const LIMIT = 70;
  let startY = null, dist = 0;
  function show(d){ el.classList.remove('back'); el.style.opacity = Math.min(1, d / 40); el.style.transform = `translate(-50%, ${Math.min(d, 90) - 80}px)`; }
  function hide(){ el.classList.add('back'); el.style.opacity = 0; el.style.transform = 'translate(-50%,-80px)'; el.classList.remove('ready','spin'); }
  window.addEventListener('touchstart', e=>{ startY = (window.scrollY <= 0 && e.touches.length === 1) ? e.touches[0].clientY : null; dist = 0; }, {passive:true});
  window.addEventListener('touchmove', e=>{
    if (startY === null || loading) return;
    dist = e.touches[0].clientY - startY;
    if (dist <= 0 || window.scrollY > 0){ dist = 0; hide(); return; }
    show(dist * 0.6);
    const ready = dist * 0.6 >= LIMIT;
    el.classList.toggle('ready', ready);
    txt.textContent = ready ? 'Release to refresh' : 'Pull to refresh';
  }, {passive:true});
  window.addEventListener('touchend', async ()=>{
    if (startY === null) return;
    const go = dist * 0.6 >= LIMIT; startY = null;
    if (!go){ hide(); return; }
    el.classList.remove('ready'); el.classList.add('spin'); txt.textContent = 'Refreshing…';
    await refreshFeed(true);
    hide();
  }, {passive:true});
})();
/* hide header and tab bar while scrolling down, bring them back on scroll up */
(function(){
  const top = document.querySelector('.top'), bar = document.querySelector('.tabs');
  let lastY = window.scrollY, ticking = false, hidden = false;
  function set(h){ if (h === hidden) return; hidden = h; top.classList.toggle('hide', h); bar.classList.toggle('hide', h); }
  function onScroll(){
    const y = Math.max(0, window.scrollY), dy = y - lastY;
    const nearBottom = window.innerHeight + y >= document.documentElement.scrollHeight - 4;
    if (y < 40) set(false);
    else if (dy > 6 && !nearBottom) set(true);
    else if (dy < -6) set(false);
    if (Math.abs(dy) > 6 || y < 40) lastY = y;
    ticking = false;
  }
  window.addEventListener('scroll', ()=>{ if (!ticking){ ticking = true; requestAnimationFrame(onScroll); } }, {passive:true});
  document.addEventListener('focusin', e=>{ if (e.target.closest('.top,.tabs')) set(false); });
  window.__showBars = ()=>{ set(false); lastY = window.scrollY; };
})();
boot();
</script>
